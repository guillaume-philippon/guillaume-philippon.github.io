# Cyberware Data Structure
# This file contains cyberware information with support for grades and levels

# Cyberware Grades Definition
grades:
  standard:
    essence_multiplier: 1.0
    price_multiplier: 1.0
    description: "Standard quality cyberware"
  alpha:
    essence_multiplier: 0.9
    price_multiplier: 2.0
    description: "High-quality cyberware with reduced essence cost"
  beta:
    essence_multiplier: 0.8
    price_multiplier: 4.0
    description: "Top-of-the-line cyberware with minimal essence cost"
  delta:
    essence_multiplier: 0.7
    price_multiplier: 8.0
    description: "Experimental cyberware with cutting-edge technology"
  used:
    essence_multiplier: 1.0
    price_multiplier: 0.5
    availability_modifier: +2
    description: "Second-hand cyberware with potential wear"

# Cyberware Categories
categories:
  - id: bodyware
    name: "Bodyware"
    description: "Internal cybernetic enhancements"
  - id: cyberlimb
    name: "Cyberlimbs"
    description: "Full limb replacements"
  - id: eyeware
    name: "Eyeware"
    description: "Eye enhancements and replacements"
  - id: headware
    name: "Headware"
    description: "Head-mounted cybernetics"
  - id: accessories
    name: "Accessories"
    description: "Additional cybernetic accessories"
  - id: bioware
    name: "Bioware"
    description: "Biological enhancements"

