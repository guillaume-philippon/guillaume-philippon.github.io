# Powers List
# This file contains the complete list of adept powers available in the game

powers:
  - id: improved_reflexes
    name: "Improved Reflexes"
    category: adept
    type: passive
    description: "Augments reaction and initiative"
    sourcebook: "20th Anniversary Core Rulebook"
    page: 312
    effects:
      - "Reaction: +1 per level"
      - "Initiative: +1 pass per level"
    levels:
      - level: 1
        magic_cost: 1.5
        reaction_bonus: 1
        initiative_pass: 1
      - level: 2
        magic_cost: 3.0
        reaction_bonus: 2
        initiative_pass: 2
      - level: 3
        magic_cost: 4.5
        reaction_bonus: 3
        initiative_pass: 3

