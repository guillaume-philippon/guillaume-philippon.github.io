---
layout: default
title: Personnages
---
<div class="container my-5">
  <h1>Liste des Personnages</h1>
  <div class="row">
    {% for character in site.characters %}
    <div class="col-md-4 mb-4">
      <div class="card">
        <div
          class="card-body bg-{{ character.theme.color }}-subtle card-custom"
          style="background-image: url('{{ character.infos.picture }}');"
        >
          <div>
            <h5 class="card-title">{{ character.full_name }}</h5>
            <p class="card-text">{{ character.race }}</p>
          </div>
          <a href="{{ character.url }}" class="character btn btn-{{ character.theme.color }}">Voir la fiche</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
