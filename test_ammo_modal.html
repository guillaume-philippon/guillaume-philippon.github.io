<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ammo Modal Test</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            margin-bottom: 20px;
        }
        
        .card-header {
            background-color: #2d2d2d;
            color: #ffcc00;
            border-bottom: 1px solid #ffcc00;
        }
        
        .ammo-counter {
            vertical-align: middle;
            font-size: 0.9rem;
        }
        
        .ammo-counter .current-ammo {
            font-weight: bold;
            min-width: 20px;
            display: inline-block;
            text-align: center;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: #ffcc00;
        }
        
        .ammo-counter .current-ammo:hover {
            background-color: rgba(255, 204, 0, 0.2);
            transform: scale(1.05);
        }
        
        .ammo-counter .max-ammo {
            color: #adadad;
            font-size: 0.85rem;
        }
        
        .ammo-counter .text-danger {
            color: #ff4444 !important;
            font-weight: bold;
        }
        
        .ammo-counter .ammo-reload {
            margin-left: 0.5rem;
            color: #ffcc00;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ammo-counter .ammo-reload:hover {
            color: #e6b800;
            transform: scale(1.2) rotate(15deg);
        }
        
        .ammo-counter .ammo-reload.reloading {
            animation: spin 0.5s ease;
            color: #ff4444;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .modal-content {
            background-color: #2a2a2a;
            border: 1px solid #ffcc00;
            color: #e0e0e0;
        }
        
        .modal-header {
            background-color: #2d2d2d;
            border-bottom: 1px solid #ffcc00;
            color: #ffcc00;
        }
        
        .form-control {
            background-color: #2d2d2d;
            border: 1px solid #555;
            color: #e0e0e0;
        }
        
        .form-control:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 0 0.2rem rgba(255, 204, 0, 0.25);
        }
        
        .btn-primary {
            background-color: #ffcc00;
            border-color: #ffcc00;
            color: #000;
        }
        
        .btn-secondary {
            background-color: #555;
            border-color: #555;
        }
        
        .btn-warning {
            background-color: #ff9900;
            border-color: #ff9900;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center" style="color: #ffcc00;">Ammo Modal Test</h1>
        <p class="text-center mb-4">Click on the ammo count to open the modal editor</p>
        
        <div class="card">
            <div class="card-header">
                <h3>Ares Crusader - Test Weapon</h3>
            </div>
            <div class="card-body">
                <div class="ammo-counter d-inline-block" data-weapon-id="test-weapon-1">
                    <span class="current-ammo mx-1 ammo-modal-trigger" data-bs-toggle="modal" data-bs-target="#ammoModalTemplate" title="Click to edit ammo">40(c)</span>
                    <span class="text-muted">/</span>
                    <span class="max-ammo mx-1">40(c)</span>
                    <i class="fas fa-sync-alt ammo-reload" title="Reload"></i>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Ares Alpha - Test Weapon 2</h3>
            </div>
            <div class="card-body">
                <div class="ammo-counter d-inline-block" data-weapon-id="test-weapon-2">
                    <span class="current-ammo mx-1 ammo-modal-trigger" data-bs-toggle="modal" data-bs-target="#ammoModalTemplate" title="Click to edit ammo">42</span>
                    <span class="text-muted">/</span>
                    <span class="max-ammo mx-1">42</span>
                    <i class="fas fa-sync-alt ammo-reload" title="Reload"></i>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Low Ammo Test (should be red)</h3>
            </div>
            <div class="card-body">
                <div class="ammo-counter d-inline-block" data-weapon-id="test-weapon-3">
                    <span class="current-ammo mx-1 ammo-modal-trigger text-danger" data-bs-toggle="modal" data-bs-target="#ammoModalTemplate" title="Click to edit ammo">5</span>
                    <span class="text-muted">/</span>
                    <span class="max-ammo mx-1">40</span>
                    <i class="fas fa-sync-alt ammo-reload" title="Reload"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Ammo Modal -->
    <div class="modal fade" id="ammoModalTemplate" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Ammo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="ammoCount" class="form-label">Current Ammo</label>
                        <input type="number" class="form-control" id="ammoCount" min="0">
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Max: <span id="maxAmmoDisplay">40</span></span>
                        <button class="btn btn-sm btn-warning" id="setToMaxBtn">Set to Max</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveAmmoBtn">Save</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Ammo Counter Script -->
    <script>
// Ammo Counter Script
// Manages ammo counters for ranged weapons with modal editing

// Cookie utilities
function setCookie(name, value, days) {
    const date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    const expires = "expires=" + date.toUTCString();
    document.cookie = name + "=" + value + ";" + expires + ";path=/;";
}

function getCookie(name) {
    const cookieName = name + "=";
    const decodedCookie = decodeURIComponent(document.cookie);
    const cookieArray = decodedCookie.split(';');
    
    for(let i = 0; i < cookieArray.length; i++) {
        let cookie = cookieArray[i];
        while (cookie.charAt(0) == ' ') {
            cookie = cookie.substring(1);
        }
        if (cookie.indexOf(cookieName) == 0) {
            return cookie.substring(cookieName.length, cookie.length);
        }
    }
    return null;
}

// Helper function to extract number from ammo string (e.g., "40(c)" -> 40)
function extractAmmoNumber(ammoString) {
    if (!ammoString) return NaN;
    
    // Extract numbers from strings like "40(c)" or "42"
    const match = ammoString.match(/\d+/);
    return match ? parseInt(match[0]) : NaN;
}

// Current weapon being edited
let currentWeaponId = null;
let currentAmmoSpan = null;
let currentMaxAmmo = null;

document.addEventListener('DOMContentLoaded', function() {
    console.log('Ammo counter script loaded');
    
    // Initialize ammo counters
    const ammoCounters = document.querySelectorAll('.ammo-counter');
    
    if (ammoCounters.length > 0) {
        console.log('Found ' + ammoCounters.length + ' ammo counters');
    }
    
    // Add event listeners for modal triggers and reload buttons
    ammoCounters.forEach(function(counter) {
        const weaponId = counter.getAttribute('data-weapon-id');
        console.log('Found ammo counter for weapon: ' + weaponId);
        const ammoModalTrigger = counter.querySelector('.ammo-modal-trigger');
        const currentAmmoSpan = counter.querySelector('.current-ammo');
        const maxAmmoSpan = counter.querySelector('.max-ammo');
        
        // Check if all required elements exist
        if (!currentAmmoSpan || !maxAmmoSpan) {
            console.error('Ammo counter elements not found for weapon: ' + weaponId);
            return;
        }
        
        // Load saved ammo count from cookie
        const savedAmmo = getCookie('ammo_' + weaponId);
        if (savedAmmo) {
            // If we have a saved numeric value, use it (replacing the initial "40(c)" format)
            currentAmmoSpan.textContent = savedAmmo;
        } else {
            // If no saved value, extract the number from the initial value
            const initialAmmo = extractAmmoNumber(currentAmmoSpan.textContent);
            if (!isNaN(initialAmmo)) {
                currentAmmoSpan.textContent = initialAmmo;
            }
        }
        
        // Update low ammo warning
        updateLowAmmoWarning(currentAmmoSpan, maxAmmoSpan);
        
        // Modal trigger for editing ammo
        if (ammoModalTrigger) {
            ammoModalTrigger.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Store current weapon info
                currentWeaponId = weaponId;
                currentAmmoSpan = currentAmmoSpan;
                currentMaxAmmo = extractAmmoNumber(maxAmmoSpan.textContent);
                
                // Get current ammo value
                const currentAmmo = extractAmmoNumber(currentAmmoSpan.textContent);
                
                // Set up modal
                const modal = new bootstrap.Modal(document.getElementById('ammoModalTemplate'));
                document.getElementById('ammoCount').value = !isNaN(currentAmmo) ? currentAmmo : 0;
                document.getElementById('maxAmmoDisplay').textContent = !isNaN(currentMaxAmmo) ? currentMaxAmmo : 'N/A';
                
                // Set max attribute for input
                document.getElementById('ammoCount').max = currentMaxAmmo;
                
                // Show modal
                modal.show();
            });
        }
        
        // Reload ammo
        const reloadBtn = counter.querySelector('.ammo-reload');
        if (reloadBtn) {
            reloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const maxAmmo = extractAmmoNumber(maxAmmoSpan.textContent);
                if (!isNaN(maxAmmo)) {
                    currentAmmoSpan.textContent = maxAmmo;
                    setCookie('ammo_' + weaponId, maxAmmo, 30);
                    currentAmmoSpan.classList.remove('text-danger');
                    
                    reloadBtn.classList.add('reloading');
                    setTimeout(() => {
                        reloadBtn.classList.remove('reloading');
                    }, 500);
                    
                    // Update low ammo warning
                    updateLowAmmoWarning(currentAmmoSpan, maxAmmoSpan);
                }
            });
        }
    });
    
    // Set up modal buttons
    setupModalButtons();
});

function setupModalButtons() {
    // Set to Max button
    document.getElementById('setToMaxBtn').addEventListener('click', function() {
        const maxAmmo = currentMaxAmmo;
        if (!isNaN(maxAmmo)) {
            document.getElementById('ammoCount').value = maxAmmo;
        }
    });
    
    // Save button
    document.getElementById('saveAmmoBtn').addEventListener('click', function() {
        const ammoInput = document.getElementById('ammoCount');
        const newAmmoValue = parseInt(ammoInput.value);
        
        if (!isNaN(newAmmoValue) && !isNaN(currentMaxAmmo) && newAmmoValue >= 0 && newAmmoValue <= currentMaxAmmo) {
            // Update display
            currentAmmoSpan.textContent = newAmmoValue;
            
            // Save to cookie
            setCookie('ammo_' + currentWeaponId, newAmmoValue, 30);
            
            // Update low ammo warning
            const maxAmmoSpan = currentAmmoSpan.nextElementSibling.nextElementSibling; // Get max ammo span
            updateLowAmmoWarning(currentAmmoSpan, maxAmmoSpan);
            
            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('ammoModalTemplate'));
            modal.hide();
        } else {
            alert('Please enter a valid ammo value between 0 and ' + currentMaxAmmo);
        }
    });
}

function updateLowAmmoWarning(currentAmmoSpan, maxAmmoSpan) {
    const currentAmmo = extractAmmoNumber(currentAmmoSpan.textContent);
    const maxAmmo = extractAmmoNumber(maxAmmoSpan.textContent);
    
    if (!isNaN(currentAmmo) && !isNaN(maxAmmo)) {
        if (currentAmmo <= maxAmmo * 0.2) {
            currentAmmoSpan.classList.add('text-danger');
        } else {
            currentAmmoSpan.classList.remove('text-danger');
        }
    }
}
    </script>
</body>
</html>
