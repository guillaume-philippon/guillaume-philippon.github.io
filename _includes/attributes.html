<div class="col-12 mt-2">
    <div class="row">
      <div class="col-lg-6">
        <!--
        <h3 class="mt-3">Attributs</h3>
        -->
          <ul class="list-group list-group-flush attributes-bottom">
            {% for attr in page.attributes %}
              <li class="list-group-item  py-1 d-flex justify-content-between align-items-center">
                <strong>{{ attr[0] | capitalize }}</strong>
                <span><strong>{{ attr[1].base }}{% if attr[1].modifier != 0 %} (+{{ attr[1].modifier }}){% endif %}</strong> <small>/{{ attr[1].max }}</small></span>
              </li>
            {% endfor %}
          </ul>
        </div>
      <div class="col-lg-6">
        {% include damage.html %}
      </div>
    </div>
    {% include weapons.html %}
</div>
