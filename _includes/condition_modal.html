<!-- Condition Tracker Modal -->
<input type="hidden" id="character-key" value="{{ page.key }}">
<input type="hidden" id="base-physical-condition" value="{{ physic_condition }}">
<input type="hidden" id="base-mental-condition" value="{{ mental_condition }}">
<input type="hidden" id="base-matrix-condition" value="{{ matrix_condition }}">

<div class="modal fade" id="conditionModal" tabindex="-1" aria-labelledby="conditionModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="conditionModalLabel">Gestion des Conditions</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul class="nav nav-tabs" id="conditionTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="physical-tab" data-bs-toggle="tab" data-bs-target="#physical" type="button" role="tab">Physique</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="mental-tab" data-bs-toggle="tab" data-bs-target="#mental" type="button" role="tab">Mentale</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="matrix-tab" data-bs-toggle="tab" data-bs-target="#matrix" type="button" role="tab">Matrix</button>
          </li>
        </ul>
        <div class="tab-content" id="conditionTabsContent">
          <!-- Physical Condition Tab -->
          <div class="tab-pane fade show active" id="physical" role="tabpanel">
            <div class="mt-3 text-center">
              <h5>Condition Physique</h5>
              <div class="display-4" id="modal-physical-condition">0</div>
              <div class="mb-3">
                <span class="badge bg-warning">Max: <span id="modal-physical-max">{{ physic_condition }}</span></span>
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-danger" id="modal-add-physical-damage">+1 Dégât</button>
                <button class="btn btn-success" id="modal-remove-physical-damage">-1 Dégât</button>
                <button class="btn btn-warning" id="modal-reset-physical-damage">Réinitialiser</button>
              </div>
            </div>
          </div>
          <!-- Mental Condition Tab -->
          <div class="tab-pane fade" id="mental" role="tabpanel">
            <div class="mt-3 text-center">
              <h5>Condition Mentale</h5>
              <div class="display-4" id="modal-mental-condition">0</div>
              <div class="mb-3">
                <span class="badge bg-info">Max: <span id="modal-mental-max">{{ mental_condition }}</span></span>
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-danger" id="modal-add-mental-damage">+1 Dégât</button>
                <button class="btn btn-success" id="modal-remove-mental-damage">-1 Dégât</button>
                <button class="btn btn-warning" id="modal-reset-mental-damage">Réinitialiser</button>
              </div>
            </div>
          </div>
          <!-- Matrix Condition Tab -->
          <div class="tab-pane fade" id="matrix" role="tabpanel">
            <div class="mt-3 text-center">
              <h5>Condition Matrix</h5>
              <div class="display-4" id="modal-matrix-condition">0</div>
              <div class="mb-3">
                <span class="badge bg-success">Max: <span id="modal-matrix-max">{{ matrix_condition }}</span></span>
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-danger" id="modal-add-matrix-damage">+1 Dégât</button>
                <button class="btn btn-success" id="modal-remove-matrix-damage">-1 Dégât</button>
                <button class="btn btn-warning" id="modal-reset-matrix-damage">Réinitialiser</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<!-- Include the condition tracker script -->
<script src="/assets/js/condition_tracker.js"></script>
