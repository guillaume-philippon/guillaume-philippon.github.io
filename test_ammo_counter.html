<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ammo Counter Test</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        .ammo-counter {
            vertical-align: middle;
            font-size: 0.9rem;
        }
        .ammo-counter .btn {
            padding: 0.1rem 0.4rem;
            line-height: 1;
            min-width: 24px;
        }
        .ammo-counter .current-ammo {
            font-weight: bold;
            min-width: 20px;
            display: inline-block;
            text-align: center;
            font-size: 0.95rem;
        }
        .ammo-counter .max-ammo {
            color: #adadad;
            font-size: 0.85rem;
        }
        .ammo-counter .text-danger {
            color: #ff4444 !important;
            font-weight: bold;
        }
        .ammo-counter .ammo-reload {
            margin-left: 0.5rem;
            color: #ffcc00;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ammo-counter .ammo-reload:hover {
            color: #e6b800;
            transform: scale(1.2) rotate(15deg);
        }
        .ammo-counter .ammo-reload.reloading {
            animation: spin 0.5s ease;
            color: #ff4444;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Ammo Counter Test</h1>
        <p>This tests the ammo counter functionality with different ammo formats.</p>
        
        <div class="card mb-4">
            <div class="card-header">
                <h3>Test Case 1: Standard Ammo (40(c))</h3>
            </div>
            <div class="card-body">
                <div class="ammo-counter d-inline-block" data-weapon-id="test-weapon-1">
                    <button class="btn btn-xs btn-outline-secondary ammo-decrement" title="Decrement ammo">-</button>
                    <span class="current-ammo mx-1">40(c)</span>
                    <span class="text-muted">/</span>
                    <span class="max-ammo mx-1">40(c)</span>
                    <button class="btn btn-xs btn-outline-secondary ammo-increment" title="Increment ammo">+</button>
                    <i class="fas fa-sync-alt ammo-reload" title="Reload"></i>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h3>Test Case 2: Simple Number (42)</h3>
            </div>
            <div class="card-body">
                <div class="ammo-counter d-inline-block" data-weapon-id="test-weapon-2">
                    <button class="btn btn-xs btn-outline-secondary ammo-decrement" title="Decrement ammo">-</button>
                    <span class="current-ammo mx-1">42</span>
                    <span class="text-muted">/</span>
                    <span class="max-ammo mx-1">42</span>
                    <button class="btn btn-xs btn-outline-secondary ammo-increment" title="Increment ammo">+</button>
                    <i class="fas fa-sync-alt ammo-reload" title="Reload"></i>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h3>Test Case 3: Low Ammo Warning (should turn red at ≤20%)</h3>
            </div>
            <div class="card-body">
                <div class="ammo-counter d-inline-block" data-weapon-id="test-weapon-3">
                    <button class="btn btn-xs btn-outline-secondary ammo-decrement" title="Decrement ammo">-</button>
                    <span class="current-ammo mx-1">5</span>
                    <span class="text-muted">/</span>
                    <span class="max-ammo mx-1">40</span>
                    <button class="btn btn-xs btn-outline-secondary ammo-increment" title="Increment ammo">+</button>
                    <i class="fas fa-sync-alt ammo-reload" title="Reload"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Ammo Counter Script -->
    <script>
// Ammo Counter Script
// Manages ammo counters for ranged weapons

// Cookie utilities
function setCookie(name, value, days) {
    const date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    const expires = "expires=" + date.toUTCString();
    document.cookie = name + "=" + value + ";" + expires + ";path=/;";
}

function getCookie(name) {
    const cookieName = name + "=";
    const decodedCookie = decodeURIComponent(document.cookie);
    const cookieArray = decodedCookie.split(';');
    
    for(let i = 0; i < cookieArray.length; i++) {
        let cookie = cookieArray[i];
        while (cookie.charAt(0) == ' ') {
            cookie = cookie.substring(1);
        }
        if (cookie.indexOf(cookieName) == 0) {
            return cookie.substring(cookieName.length, cookie.length);
        }
    }
    return null;
}

document.addEventListener('DOMContentLoaded', function() {
    console.log('Ammo counter script loaded');
    
    // Initialize ammo counters
    const ammoCounters = document.querySelectorAll('.ammo-counter');
    
    if (ammoCounters.length > 0) {
        console.log('Found ' + ammoCounters.length + ' ammo counters');
    }
    
    // Add event listeners for increment/decrement buttons
    ammoCounters.forEach(function(counter) {
        const weaponId = counter.getAttribute('data-weapon-id');
        console.log('Found ammo counter for weapon: ' + weaponId);
        const decrementBtn = counter.querySelector('.ammo-decrement');
        const incrementBtn = counter.querySelector('.ammo-increment');
        const currentAmmoSpan = counter.querySelector('.current-ammo');
        const maxAmmoSpan = counter.querySelector('.max-ammo');
        
        // Check if all required elements exist
        if (!currentAmmoSpan || !maxAmmoSpan) {
            console.error('Ammo counter elements not found for weapon: ' + weaponId);
            return;
        }
        
        // Helper function to extract number from ammo string (e.g., "40(c)" -> 40)
        function extractAmmoNumber(ammoString) {
            if (!ammoString) return NaN;
            
            // Extract numbers from strings like "40(c)" or "42"
            const match = ammoString.match(/\d+/);
            return match ? parseInt(match[0]) : NaN;
        }
        
        // Load saved ammo count from cookie
        const savedAmmo = getCookie('ammo_' + weaponId);
        if (savedAmmo) {
            // If we have a saved numeric value, use it (replacing the initial "40(c)" format)
            currentAmmoSpan.textContent = savedAmmo;
        } else {
            // If no saved value, extract the number from the initial value
            const initialAmmo = extractAmmoNumber(currentAmmoSpan.textContent);
            if (!isNaN(initialAmmo)) {
                currentAmmoSpan.textContent = initialAmmo;
            }
        }
        
        // Decrement ammo
        if (decrementBtn) {
            decrementBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                let currentAmmo = extractAmmoNumber(currentAmmoSpan.textContent);
                const maxAmmo = extractAmmoNumber(maxAmmoSpan.textContent);
                
                if (!isNaN(currentAmmo) && !isNaN(maxAmmo) && currentAmmo > 0) {
                    currentAmmo--;
                    currentAmmoSpan.textContent = currentAmmo;
                    setCookie('ammo_' + weaponId, currentAmmo, 30);
                    
                    if (currentAmmo <= maxAmmo * 0.2) {
                        currentAmmoSpan.classList.add('text-danger');
                    } else {
                        currentAmmoSpan.classList.remove('text-danger');
                    }
                }
            });
        }
        
        // Increment ammo
        if (incrementBtn) {
            incrementBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                let currentAmmo = extractAmmoNumber(currentAmmoSpan.textContent);
                const maxAmmo = extractAmmoNumber(maxAmmoSpan.textContent);
                
                if (!isNaN(currentAmmo) && !isNaN(maxAmmo) && currentAmmo < maxAmmo) {
                    currentAmmo++;
                    currentAmmoSpan.textContent = currentAmmo;
                    setCookie('ammo_' + weaponId, currentAmmo, 30);
                    currentAmmoSpan.classList.remove('text-danger');
                }
            });
        }
        
        // Reload ammo
        const reloadBtn = counter.querySelector('.ammo-reload');
        if (reloadBtn) {
            reloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const maxAmmo = extractAmmoNumber(maxAmmoSpan.textContent);
                if (!isNaN(maxAmmo)) {
                    currentAmmoSpan.textContent = maxAmmo;
                    setCookie('ammo_' + weaponId, maxAmmo, 30);
                    currentAmmoSpan.classList.remove('text-danger');
                    
                    reloadBtn.classList.add('reloading');
                    setTimeout(() => {
                        reloadBtn.classList.remove('reloading');
                    }, 500);
                }
            });
        }
    });
});
    </script>
</body>
</html>
