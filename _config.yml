title: Les Ombres Éveillées
description: Générateur de fiches de personnage pour Shadowrun 4ème édition
baseurl: "/"
url: "https://guillaume-philippon.github.io"
markdown: kramdown

# Déclaration de la collection
collections:
  characters:
    output: true
    permalink: /characters/:name/
  contacts:
    output: true
    permalink: /contacts/:name/
  missions:
    output: true
    permalink: /missions/:name/
  factions:
    output: true
    permalink: /factions/:name/

defaults:
  - scope:
      path: ""
      type: "characters"
    values:
      layout: "character"
  - scope:
      path: ""
      type: "contacts"
    values:
      layout: "contact"
  - scope:
      path: ""
      type: "missions"
    values:
      layout: "mission"
  - scope:
      path: ""
      type: "factions"
    values:
      layout: "faction"
