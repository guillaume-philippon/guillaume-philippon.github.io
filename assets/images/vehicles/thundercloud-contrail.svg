<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vehicleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#vehicleGradient)" />
  
  <!-- Vehicle Body -->
  <path d="M50,200 Q100,150 200,180 Q300,210 350,170 L320,170 Q280,200 200,190 Q120,180 80,180 Z" fill="#222222" stroke="#ffcc00" stroke-width="2"/>
  
  <!-- Front Wheel -->
  <circle cx="80" cy="220" r="30" fill="#111111" stroke="#ffcc00" stroke-width="2"/>
  <circle cx="80" cy="220" r="20" fill="#333333" />
  
  <!-- Rear Wheel -->
  <circle cx="320" cy="220" r="35" fill="#111111" stroke="#ffcc00" stroke-width="2"/>
  <circle cx="320" cy="220" r="25" fill="#333333" />
  
  <!-- Seat -->
  <path d="M150,160 Q180,140 210,160 L200,180 Q180,170 160,180 Z" fill="#444444" />
  
  <!-- Handlebar -->
  <path d="M120,150 Q140,130 160,150" stroke="#ffcc00" stroke-width="3" fill="none"/>
  
  <!-- Accent Lines -->
  <path d="M60,190 Q100,170 150,180" stroke="url(#accentGradient)" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M250,195 Q300,185 340,190" stroke="url(#accentGradient)" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  
  <!-- Vehicle Name -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="16" fill="#ffcc00" text-anchor="middle" font-weight="bold">
    Thundercloud Contrail
  </text>
  
  <!-- Shadowrun Logo Accent -->
  <text x="370" y="270" font-family="Arial, sans-serif" font-size="12" fill="#ffcc00" text-anchor="end">
    Shadowrun 4th
  </text>
</svg>