<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shadowrunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0a800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background - Dark with subtle pattern -->
  <rect width="100" height="100" fill="#1a1a1a" />
  
  <!-- Shadowrun "S" Logo - Stylized -->
  <path d="M20,20 Q40,10 60,20 Q70,30 60,50 Q50,70 40,60 Q30,50 40,30 Q50,10 60,20 L60,80 Q40,90 20,80 Q10,70 20,50 Q30,30 20,20 Z" 
        fill="url(#shadowrunGradient)" filter="url(#glow)" />
  
  <!-- Cyberpunk circuit lines -->
  <path d="M15,25 L25,15 M75,25 L85,15 M15,75 L25,85 M75,75 L85,85" 
        stroke="#ffcc00" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Matrix grid effect -->
  <path d="M10,10 L90,10 M10,30 L90,30 M10,50 L90,50 M10,70 L90,70 M10,90 L90,90" 
        stroke="#333333" stroke-width="0.5" opacity="0.3"/>
  <path d="M10,10 L10,90 M30,10 L30,90 M50,10 L50,90 M70,10 L70,90 M90,10 L90,90" 
        stroke="#333333" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Glowing dot - Cyberpunk element -->
  <circle cx="50" cy="50" r="3" fill="#ffcc00" filter="url(#glow)" />
  
  <!-- Text "SR" in small -->
  <text x="45" y="90" font-family="Arial, sans-serif" font-size="8" fill="#ffcc00" font-weight="bold">
    SR
  </text>
</svg>